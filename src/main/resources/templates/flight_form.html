<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aerolínea UdeA - Evaluación de Vuelo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 650px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
            <h3 class="mb-0">✈️ Aerolínea UdeA - Solicitud de Vuelo</h3>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/airline/evaluate}" th:object="${flightRequest}" method="post">
                
                <h5 class="text-primary border-bottom pb-2">Datos del Pasajero</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="passenger.name" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" th:field="*{passenger.name}" required />
                    </div>
                    <div class="col-md-6">
                        <label for="passenger.age" class="form-label">Edad:</label>
                        <input type="number" class="form-control" th:field="*{passenger.age}" required />
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="passenger.membershipStatus" class="form-label">Membresía:</label>
                        <select class="form-select" th:field="*{passenger.membershipStatus}">
                            <option value="Basic">Basic</option>
                            <option value="GOLD">GOLD</option>
                            <option value="PLATINUM">PLATINUM</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="passenger.seatPreference" class="form-label">Preferencia de Asiento:</label>
                        <select class="form-select" th:field="*{passenger.seatPreference}">
                            <option value="Any">Cualquiera (Any)</option>
                            <option value="Window">Ventana</option>
                            <option value="Aisle">Pasillo</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" th:field="*{passenger.travelingWithChildren}" id="children">
                            <label class="form-check-label" for="children">¿Viaja con niños?</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" th:field="*{passenger.eligibleForUpgrade}" id="upgrade">
                            <label class="form-check-label" for="upgrade">Elegible para ascenso</label>
                        </div>
                    </div>
                </div>

                <h5 class="text-primary border-bottom pb-2 mt-4">Datos del Vuelo</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="flight.baggageWeight" class="form-label">Peso del Equipaje (kg):</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{flight.baggageWeight}" required />
                    </div>
                    <div class="col-md-6">
                        <label for="flight.delayMinutes" class="form-label">Retraso (minutos):</label>
                        <input type="number" class="form-control" th:field="*{flight.delayMinutes}" required />
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="flight.flightDurationHours" class="form-label">Duración Vuelo (horas):</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{flight.flightDurationHours}" required />
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" th:field="*{flight.emergencyExitSeatAvailable}" id="exitSeat">
                            <label class="form-check-label" for="exitSeat">Salida de emergencia libre</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Evaluar Reglas del Vuelo</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
